[project]
name = "greengauge-api"
version = "0.1.0"
description = "GreenGauge recommendation and telemetry API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116.1,<1.0",
  "httpx>=0.28.1,<1.0",
  "pydantic-settings>=2.10.1,<3.0",
  "uvicorn[standard]>=0.35.0,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greengauge_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

